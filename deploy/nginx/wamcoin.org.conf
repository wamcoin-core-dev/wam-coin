# The website, served from machines this project owns.
#
# =========================================================================
#  WHY THIS FILE EXISTS
# =========================================================================
#
#  wamcoin.org pointed at GitHub Pages until 2026-09-24. That day the
#  account was suspended and the domain returned 404 to everybody: the
#  documentation, the download instructions and the security page, all gone
#  at once, because the front door of the project was somebody else's
#  machine.
#
#  This file is the answer, and the rule that goes with it is short:
#
#      THE DOMAIN POINTS AT OUR OWN SERVERS AND IS NEVER MOVED AGAIN.
#
#  When GitHub comes back it becomes a mirror of the code, nothing more. No
#  service anybody depends on is ever reached through a third party's
#  hostname again, because the thing that failed was not GitHub -- it was
#  having one address with one owner behind it.
#
#  It is installed on MORE THAN ONE host, with an A record for each, so a
#  browser that cannot reach the first tries the next by itself. Losing a
#  machine is then a slow page, not an outage.
#
#  The content comes straight from the deployed checkout at /opt/wam/site,
#  which deploy.sh already keeps at origin/main on every host. Nothing is
#  copied, so nothing can be stale in one place and fresh in another.
# =========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name wamcoin.org www.wamcoin.org;

    root /opt/wam/site;
    index index.html;

    # The ACME challenge, and why it is not simply a local directory.
    #
    # The domain has an A record for every host that serves it, which is what
    # makes losing one of them survivable. It also means Let's Encrypt picks
    # ONE of those addresses at random when it verifies ownership -- and the
    # token it is looking for exists only on the machine where certbot ran.
    # Issuing on each host independently therefore fails about half the time,
    # per domain, for reasons that read like a DNS fault and are not one.
    #
    # So one host answers the challenge for all of them. WAM_ACME_UPSTREAM is
    # empty on that host and holds its address on every other, where this
    # block becomes a proxy. Renewal then works whichever address the CA
    # happens to ask, today and in sixty days.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # The releases, served from a machine this project owns.
    #
    # Every archive here is byte-identical to the one that was signed --
    # checked against SHA256SUMS before it was uploaded, not assumed -- and
    # SHA256SUMS.asc sits beside it. So the host is irrelevant to whether a
    # download can be trusted, which is the whole point of signing them: when
    # the old download URLs disappeared on 2026-09-24, nothing about their
    # verifiability was lost with them.
    #
    # autoindex on purpose. A directory a person can read is a directory a
    # person can check, and there is nothing here that is not meant to be
    # downloaded.
    location /downloads/ {
        alias /var/www/wam-downloads/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # Archives, not pages. Serving them as octet-stream stops a browser
        # trying to render one and stops any of them being interpreted.
        types { } default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
    }

    # The site is static files and nothing else. No upload path, no script
    # interpreter, no proxy: a web server with nothing to execute cannot be
    # made to execute anything.
    # The signing key and the two verifier scripts, served from the deployed
    # checkout so they cannot drift from the source they came from.
    #
    # They used to be fetched from raw.githubusercontent.com, which means the
    # instruction "check this download against our key" depended on a third
    # party staying reachable -- and on 2026-09-24 it did not. A verification
    # step that can be taken offline by somebody else's outage is not a
    # verification step.
    location = /SIGNING-KEY.asc      { alias /opt/wam/SIGNING-KEY.asc; default_type text/plain; }
    location = /verify_release.sh    { alias /opt/wam/scripts/verify_release.sh; default_type text/plain; }
    location = /verify_release.ps1   { alias /opt/wam/scripts/verify_release.ps1; default_type text/plain; }

    location ~* \.(php|cgi|pl|py|sh)$ { return 404; }

    # A dotfile under the document root is a mistake, not a page.
    location ~ /\.(?!well-known) { deny all; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/wamcoin.org.access.log;
    error_log  /var/log/nginx/wamcoin.org.error.log;
}
