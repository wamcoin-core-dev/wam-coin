# The website, served from machines this project owns.
#
# =========================================================================
#  WHY THIS FILE EXISTS
# =========================================================================
#
#  wamcoin.org pointed at GitHub Pages until 2026-09-24. That day the
#  account was suspended and the domain returned 404 to everybody: the
#  documentation, the download instructions and the security page, all gone
#  at once, because the front door of the project was somebody else's
#  machine.
#
#  This file is the answer, and the rule that goes with it is short:
#
#      THE DOMAIN POINTS AT OUR OWN SERVERS AND IS NEVER MOVED AGAIN.
#
#  When GitHub comes back it becomes a mirror of the code, nothing more. No
#  service anybody depends on is ever reached through a third party's
#  hostname again, because the thing that failed was not GitHub -- it was
#  having one address with one owner behind it.
#
#  It is installed on MORE THAN ONE host, with an A record for each, so a
#  browser that cannot reach the first tries the next by itself. Losing a
#  machine is then a slow page, not an outage.
#
#  The content comes straight from the deployed checkout at /opt/wam/site,
#  which deploy.sh already keeps at origin/main on every host. Nothing is
#  copied, so nothing can be stale in one place and fresh in another.
# =========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name wamcoin.org www.wamcoin.org;

    root /opt/wam/site;
    index index.html;

    # Let certbot answer the ACME challenge over HTTP. Everything else is
    # redirected once a certificate exists; until then this block serves the
    # site so the domain is never dark.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # The site is static files and nothing else. No upload path, no script
    # interpreter, no proxy: a web server with nothing to execute cannot be
    # made to execute anything.
    location ~* \.(php|cgi|pl|py|sh)$ { return 404; }

    # A dotfile under the document root is a mistake, not a page.
    location ~ /\.(?!well-known) { deny all; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/wamcoin.org.access.log;
    error_log  /var/log/nginx/wamcoin.org.error.log;
}
